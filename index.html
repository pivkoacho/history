<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Исторические личности</title>
</head>
<body>
    <div class="container">
        <h2>Выберите историческую личность:</h2>
        <div class="grid">
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Peter_I_by_Kneller.jpg/400px-Peter_I_by_Kneller.jpg" alt="Пётр I" class="img">
                <button class="btn" data-value="peter1">Пётр I</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Catherine_II_by_J.B.Lampi.jpg/400px-Catherine_II_by_J.B.Lampi.jpg" alt="Екатерина II" class="img">
                <button class="btn" data-value="catherine2">Екатерина II</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Yuri_Gagarin_1961.jpg/400px-Yuri_Gagarin_1961.jpg" alt="Гагарин" class="img">
                <button class="btn" data-value="gagarin">Юрий Гагарин</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Alexander_Suvorov_by_Johann_Baptist_Lampi.jpg/400px-Alexander_Suvorov_by_Johann_Baptist_Lampi.jpg" alt="Суворов" class="img">
                <button class="btn" data-value="suvorov">Александр Суворов</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Kiprensky_Pushkin.jpg/400px-Kiprensky_Pushkin.jpg" alt="Пушкин" class="img">
                <button class="btn" data-value="pushkin">Александр Пушкин</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Vladimir_Lenin_1920.jpg/400px-Vladimir_Lenin_1920.jpg" alt="Ленин" class="img">
                <button class="btn" data-value="lenin">Владимир Ленин</button>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
