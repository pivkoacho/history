<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исторические личности</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        h2 { font-size: 18px; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .item {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 10px;
            border-radius: 12px;
        }
        .item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .btn {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active { opacity: 0.7; }
        .btn.selected { background-color: #4CAF50; }
    </style>
</head>
<body>
    <h2>Выберите личность:</h2>
    <div class="grid">
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Peter_I_by_Kneller.jpg" alt="Пётр I">
            <button class="btn" onclick="selectPerson('peter1', this)">Пётр I</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Catherine_II_by_J.B.Lampi.jpg" alt="Екатерина II">
            <button class="btn" onclick="selectPerson('catherine2', this)">Екатерина II</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Yuri_Gagarin_1961.jpg" alt="Гагарин">
            <button class="btn" onclick="selectPerson('gagarin', this)">Юрий Гагарин</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Alexander_Suvorov_by_Johann_Baptist_Lampi.jpg" alt="Суворов">
            <button class="btn" onclick="selectPerson('suvorov', this)">Александр Суворов</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c2/Kiprensky_Pushkin.jpg" alt="Пушкин">
            <button class="btn" onclick="selectPerson('pushkin', this)">Александр Пушкин</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/Vladimir_Lenin_1920.jpg" alt="Ленин">
            <button class="btn" onclick="selectPerson('lenin', this)">Владимир Ленин</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.MainButton.textColor = "#FFFFFF";
        tg.MainButton.color = "#2cab37";

        let selectedItem = "";

        function selectPerson(id, btnElement) {
            selectedItem = id;
            
            // Убираем зелёный цвет со всех кнопок
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // Делаем зелёной только нажатую кнопку
            btnElement.classList.add('selected');
            
            // Показываем большую кнопку внизу
            tg.MainButton.setText("Показать информацию");
            tg.MainButton.show();
        }

        // Что происходит при нажатии на большую зелёную кнопку
        Telegram.WebApp.onEvent("mainButtonClicked", function() {
            if (selectedItem) {
                tg.sendData(selectedItem); // Отправляем данные боту
            } else {
                tg.showAlert("Сначала выберите личность!");
            }
        });
    </script>
</body>
</html>
