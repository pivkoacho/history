<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Исторические личности</title>
</head>
<body>
    <h2>Выберите историческую личность</h2>

    <div class="grid">
        <div class="item">
            <img src="peter1.jpg" alt="Пётр I" class="img" onerror="this.style.display='none'">
            <button class="btn" data-value="peter1">Пётр I</button>
        </div>
        <div class="item">
            <img src="catherine2.jpg" alt="Екатерина II" class="img" onerror="this.style.display='none'">
            <button class="btn" data-value="catherine2">Екатерина II</button>
        </div>
        <div class="item">
            <img src="gagarin.jpg" alt="Юрий Гагарин" class="img" onerror="this.style.display='none'">
            <button class="btn" data-value="gagarin">Юрий Гагарин</button>
        </div>
        <div class="item">
            <img src="suvorov.jpg" alt="Александр Суворов" class="img" onerror="this.style.display='none'">
            <button class="btn" data-value="suvorov">Александр Суворов</button>
        </div>
        <div class="item">
            <img src="pushkin.jpg" alt="Александр Пушкин" class="img" onerror="this.style.display='none'">
            <button class="btn" data-value="pushkin">Александр Пушкин</button>
        </div>
        <div class="item">
            <img src="lenin.jpg" alt="Владимир Ленин" class="img" onerror="this.style.display='none'">
            <button class="btn" data-value="lenin">Владимир Ленин</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
