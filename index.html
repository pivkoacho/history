<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    tg.MainButton.textColor = "#FFFFFF";
    tg.MainButton.color = "#2cab37";

    let selectedItem = "";

    function selectPerson(id, btnElement) {
        selectedItem = id;
        console.log("Выбрано:", id);

        document.querySelectorAll('.btn').forEach(btn => {
            btn.classList.remove('selected');
        });
        btnElement.classList.add('selected');

        tg.MainButton.setText("Показать информацию");
        tg.MainButton.show();
    }

    tg.MainButton.onClick(function() {
        if (selectedItem) {
            // 👉 ЭТОТ АЛЕРТ ДОЛЖЕН ПОЯВИТЬСЯ НА ЭКРАНЕ ТЕЛЕФОНА
            tg.showAlert("Отправляю боту данные: " + selectedItem);
            
            // Отправляем данные
            tg.sendData(selectedItem);
        } else {
            tg.showAlert("Сначала выберите личность!");
        }
    });
</script>
