<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исторические личности</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2833;
            color: #ffffff;
            padding: 15px;
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .item {
            background-color: #2c3e50;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .item img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #34495e;
        }
        .btn {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.selected {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <h2>Выберите историческую личность:</h2>
    <div class="grid">
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Peter_I_by_Kneller.jpg/400px-Peter_I_by_Kneller.jpg" alt="Пётр I">
            <button class="btn" onclick="selectPerson('peter1', this)">Пётр I</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Catherine_II_by_J.B.Lampi.jpg/400px-Catherine_II_by_J.B.Lampi.jpg" alt="Екатерина II">
            <button class="btn" onclick="selectPerson('catherine2', this)">Екатерина II</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Yuri_Gagarin_1961.jpg/400px-Yuri_Gagarin_1961.jpg" alt="Гагарин">
            <button class="btn" onclick="selectPerson('gagarin', this)">Юрий Гагарин</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Alexander_Suvorov_by_Johann_Baptist_Lampi.jpg/400px-Alexander_Suvorov_by_Johann_Baptist_Lampi.jpg" alt="Суворов">
            <button class="btn" onclick="selectPerson('suvorov', this)">Александр Суворов</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Kiprensky_Pushkin.jpg/400px-Kiprensky_Pushkin.jpg" alt="Пушкин">
            <button class="btn" onclick="selectPerson('pushkin', this)">Александр Пушкин</button>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Vladimir_Lenin_1920.jpg/400px-Vladimir_Lenin_1920.jpg" alt="Ленин">
            <button class="btn" onclick="selectPerson('lenin', this)">Владимир Ленин</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        tg.MainButton.textColor = "#FFFFFF";
        tg.MainButton.color = "#2cab37";

        let selectedItem = "";

        function selectPerson(id, btnElement) {
            selectedItem = id;

            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('selected');
            });

            btnElement.classList.add('selected');

            tg.MainButton.setText("Показать информацию");
            tg.MainButton.show();
        }

        tg.MainButton.onClick(function() {
            if (selectedItem) {
                tg.sendData(selectedItem);
            } else {
                tg.showAlert("Сначала выберите личность!");
            }
        });
    </script>
</body>
</html>
