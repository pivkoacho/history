<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Исторические личности</title>
</head>
<body>

<div class="container">
    <h2>Выбери историческую личность:</h2>
    <div class="inner">
        <div class="item">
            <img src="peter.png" alt="Петр I" class="img">
            <button class="btn" id="btn1">Пётр I</button>
        </div>
        <div class="item">
            <img src="catherine.png" alt="Екатерина II" class="img">
            <button class="btn" id="btn2">Екатерина II</button>
        </div>
        <div class="item">
            <img src="gagarin.png" alt="Гагарин" class="img">
            <button class="btn" id="btn3">Юрий Гагарин</button>
        </div>
        <div class="item">
            <img src="suvorov.png" alt="Суворов" class="img">
            <button class="btn" id="btn4">Александр Суворов</button>
        </div>
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
